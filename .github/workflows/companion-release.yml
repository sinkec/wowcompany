# WowCompany Companion: Windows + Linux build → GitHub Release (COMPANION.md §11).
# Sprožilec: oznaka `companion-vX.Y.Z` (verzija mora biti enaka kot v desktop/src-tauri/tauri.conf.json)
#   git tag companion-v0.1.0 && git push origin companion-v0.1.0
# Ko sta oba builda uspela, job `cleanup` pobriše starejše izdaje (ostane samo najnovejša).
name: Companion release

on:
  push:
    tags: ['companion-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: companion

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Test parser + run detector
        if: runner.os == 'Linux'
        run: cargo test -p wowlog -p wowrun

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # podpis posodobitev (Companion se sam posodobi prek latest.json); ključ je pri lastniku v ~/.tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'WowCompany Companion v__VERSION__'
          releaseBody: |
            Dungeon run tracker for WowCompany. Reads your WoW combat log, uploads party stats to the portal.

            **Windows:** download `WowCompany-Companion_*_windows_x64-setup.exe`. Windows SmartScreen will whine
            ("unknown publisher") – click *More info → Run anyway*. We're friends, not a corporation.
            **Linux:** `.AppImage` (chmod +x and run) or `.deb` (`sudo apt install ./file.deb`).

            In game: type `/combatlog` every session. Then link the app on https://wowcompany.vercel.app/link
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          releaseAssetNamePattern: 'WowCompany-Companion_[version]_[platform]_[arch][setup][ext]'
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}

  # Samo najnovejša izdaja ostane: ko sta oba builda uspela, pobriše starejše izdaje Companiona in njihove oznake.
  # Če kak build pade, se nič ne briše (stara izdaja ostane za samodejne posodobitve).
  cleanup:
    needs: build
    if: github.ref_type == 'tag' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete older Companion releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ github.ref_name }}
        run: |
          gh release view "$CURRENT" --json assets -q '.assets[].name' | grep -qx latest.json \
            || { echo "new release has no latest.json – keeping the old ones"; exit 1; }
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^companion-v' | grep -vx "$CURRENT" \
            | while read -r tag; do
                echo "deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
