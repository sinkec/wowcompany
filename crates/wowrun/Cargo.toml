[package]
name = "wowrun"
version = "0.1.0"
description = "Dungeon run detection and analysis on top of the wowlog parser"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wowlog = { path = "../wowlog" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "wowrun"
path = "src/bin/wowrun.rs"
