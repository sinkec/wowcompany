<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<defs>
		<radialGradient id="bg" cx="50%" cy="35%" r="75%">
			<stop offset="0" stop-color="#3a2a1a" />
			<stop offset="1" stop-color="#140e09" />
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a3" />
			<stop offset="0.5" stop-color="#e3b04b" />
			<stop offset="1" stop-color="#9a6a1f" />
		</linearGradient>
		<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#8f9aa6" />
			<stop offset="0.5" stop-color="#f1f4f7" />
			<stop offset="1" stop-color="#7d8894" />
		</linearGradient>
		<linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbf3dc" />
			<stop offset="1" stop-color="#cdbf95" />
		</linearGradient>
		<g id="sword">
			<!-- rezilo -->
			<path d="M256 52 L276 92 L276 318 L236 318 L236 92 Z" fill="url(#steel)" stroke="#2a2018" stroke-width="6" stroke-linejoin="round" />
			<path d="M256 70 L256 312" stroke="#5d6772" stroke-width="5" />
			<!-- varovalo -->
			<rect x="186" y="316" width="140" height="26" rx="10" fill="url(#gold)" stroke="#2a2018" stroke-width="6" />
			<!-- ročaj -->
			<rect x="242" y="342" width="28" height="70" rx="6" fill="#5a2d1a" stroke="#2a2018" stroke-width="6" />
			<path d="M242 360 L270 352 M242 378 L270 370 M242 396 L270 388" stroke="#2a2018" stroke-width="4" />
			<!-- glavica -->
			<circle cx="256" cy="426" r="20" fill="url(#gold)" stroke="#2a2018" stroke-width="6" />
		</g>
	</defs>

	<!-- ozadje + zlat okvir -->
	<rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)" />
	<rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#gold)" stroke-width="16" />
	<rect x="34" y="34" width="444" height="444" rx="74" fill="none" stroke="#e3b04b" stroke-opacity="0.35" stroke-width="4" />

	<!-- prekrižana meča -->
	<use href="#sword" transform="rotate(-42 256 256)" />
	<use href="#sword" transform="rotate(42 256 256)" />

	<!-- lobanja (črni humor obvezen) -->
	<g stroke="#2a2018" stroke-width="7" stroke-linejoin="round">
		<path d="M256 168 C200 168 172 208 172 250 C172 280 188 298 204 306 L204 338 L308 338 L308 306 C324 298 340 280 340 250 C340 208 312 168 256 168 Z" fill="url(#bone)" />
		<path d="M230 312 L230 336 M256 314 L256 336 M282 312 L282 336" />
	</g>
	<ellipse cx="222" cy="254" rx="24" ry="27" fill="#1a120c" />
	<ellipse cx="290" cy="254" rx="24" ry="27" fill="#1a120c" />
	<circle cx="226" cy="250" r="6" fill="#ff7a1a" />
	<circle cx="294" cy="250" r="6" fill="#ff7a1a" />
	<path d="M256 278 L244 302 L268 302 Z" fill="#1a120c" />
</svg>
